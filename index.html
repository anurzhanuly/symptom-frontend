<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Опросник симптомов для выявления рисков для здоровья" />
    <title>Symptom</title>
</head>
<body>
<div id="mobile"></div>
<div id="desktop"></div>
<script type="module">
    const isMobile = window.matchMedia('(max-width: 768px)').matches;

    if (isMobile) {
        import('@mobile/main.ts').then(module => module.initMobileApp());
    } else {
        import('@desktop/main.ts').then(module => module.initDesktopApp());
    }
</script>

</body>
</html>
