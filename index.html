<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" href="/favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="google-site-verification" content="25duTO5mSJRMreLw5k6Z-TTvl7mlY7xu_y9TSgEpSL4" />
        <meta name="description" content="Опросник симптомов для выявления рисков для здоровья" />
        <title>Symptom</title>
    </head>
    <body>
        <div id="app"></div>
        <script type="module">
            import mainMobile from '@mobile/main.ts';
            import mainDesktop from '@desktop/main.ts';

            const isMobile = window.matchMedia('(max-width: 768px)').matches;

            switch (isMobile) {
                case true:
                    mainMobile();
                    break;
                case false:
                    mainDesktop();
                    break;
            }
        </script>

    </body>
</html>
