name: Deploy frontend to ps server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Стягиваем последние изменения
      uses: actions/checkout@v2

    - name: Ставим ноду
      uses: actions/setup-node@v2
      with:
        node-version: '18.x'

    - name: Кешируем зависимости
      uses: actions/cache@v2
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-

    - name: Устанавливаем зависимости
      run: npm install

    - name: Билдим проект
      run: npm run build

    - name: Сохраняем SSH ключ
      run: echo "${{ secrets.SSH_KEY }}" > id_rsa
      env:
        PRIVATE_KEY: ${{ secrets.SSH_KEY }}
        
    - name: Устанавливаем доступы до ключа
      run: chmod 600 id_rsa
        
    - name: Деплоим на сервак
      env:
        SERVER_HOST: 194.110.55.190
        SERVER_USER: ubuntu
      run: |
        eval "$(ssh-agent -s)"
        ssh-add id_rsa
        scp -r dist/ $SERVER_USER@$SERVER_HOST:/var/www/symptom-frontend
